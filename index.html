<!doctype html>
<!--
  MENDES — header.
  Loader: the ring turns behind a single iPod whose screen counts up to 100%. Then the other iPods burst out from
  behind it into a tilted row, float and settle; MENDES writes itself across the top, the menu rises from the bottom
  and the ring pushes out with the burst, larger and brighter. The ring, wordmark and menu follow blink.capital's
  intro (ring video and bloom, letter-by-letter wordmark, menu rise). The row is agrumeafarm.it's jar slider (used
  with permission) with iPods for jars: the same positions, sizes, blur and brightness, the wheel and drag glide
  and fling, each iPod swinging, leaning and turning on its own spring as it travels, and the pull toward the
  pointer. Hovering never spins an iPod: clicking one spins it round once and brings it to the middle.
  three.js builds the iPods in code; their screens play the clips in assets/screens. One file, no build step.
  Serve it over http (the screens are videos drawn into WebGL), not file://.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MENDES</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:,">
<style>
@font-face{font-family:"Guida Mono Pro";src:url(assets/fonts/GuidaMonoPro-Regular.woff2) format("woff2");font-weight:400;font-display:block}
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none}
.hd{position:fixed;inset:0;overflow:hidden;background:#000;--sq:max(100vw,100vh);-webkit-user-select:none;user-select:none}
/* the ring: blink.capital's ring video, kept square and centred; its edges fade out so it can sit small in the loader */
.ring{position:absolute;left:50%;top:50%;width:var(--sq);height:var(--sq);margin:calc(var(--sq) / -2) 0 0 calc(var(--sq) / -2);object-fit:cover;pointer-events:none;opacity:0;transform-origin:50% 48%;
  -webkit-mask-image:radial-gradient(closest-side at 50% 48%,#000 82%,transparent 100%);mask-image:radial-gradient(closest-side at 50% 48%,#000 82%,transparent 100%);will-change:transform,opacity}
.hd canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hd canvas.grab{cursor:grab}.hd canvas.point{cursor:pointer}.hd canvas.held{cursor:grabbing}
/* MENDES, spread edge to edge as on blink.capital; it writes itself in when the iPods land */
.logo{position:absolute;left:0;right:0;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:12px;pointer-events:none}
.logo span{font:400 64px/75% "Guida Mono Pro",ui-monospace,monospace;color:#fff;opacity:0}
.hd.on .logo span{animation:write .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(450ms + var(--i) * 150ms)}
@keyframes write{0%{opacity:0;filter:blur(12px);transform:translateY(20px)}55%{opacity:.5}100%{opacity:1;filter:none;transform:none}}
@media(min-width:1728px){.logo span{font-size:80px}}
@media(min-width:1920px){.logo span{font-size:104px}}
@media(max-width:767px){.logo span{font-size:48px}}
/* the menu rises from the bottom bar */
.menu{position:absolute;left:12px;right:12px;bottom:12px;z-index:2;display:flex;justify-content:center;opacity:0;transform:translateY(50px);pointer-events:none}
.hd.on .menu{animation:menu 3s cubic-bezier(.5,0,0,1) .7s both;pointer-events:auto}
@keyframes menu{0%{opacity:0;transform:translateY(50px)}22%{opacity:1}100%{opacity:1;transform:none}}
.menu nav{display:flex;align-items:center;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);background:#f2f2f21a}
.menu a{color:#fff;font:400 13px/1.2 "Guida Mono Pro",ui-monospace,monospace;padding:8px;text-transform:uppercase;text-decoration:none;white-space:nowrap;transition:all .2s ease-in-out}
.menu a.current,.menu a:hover{background:#fff;color:#000}
.menu a:focus-visible{outline:1px solid #fff;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.hd.on .logo span{animation-duration:.01s}.hd.on .menu{animation-duration:.01s}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<header class="hd" id="hd">
  <h1 class="sr">MENDES</h1>
  <video class="ring" src="assets/ring.mp4" autoplay muted loop playsinline preload="auto" aria-hidden="true"></video>
  <canvas aria-hidden="true"></canvas>
  <div class="logo" aria-hidden="true"><span style="--i:0">M</span><span style="--i:1">E</span><span style="--i:2">N</span><span style="--i:3">D</span><span style="--i:4">E</span><span style="--i:5">S</span></div>
  <div class="menu">
    <nav aria-label="Main">
      <a class="current" href="#" aria-current="page">Home</a><a href="#origin">Origin</a><a href="#how-it-works">How it works</a><a href="#strategy">Strategy</a><a href="#people">The people behind it</a><a href="#contacts">Contacts</a>
    </nav>
  </div>
</header>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---------- settings ----------
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const fine = matchMedia('(hover: hover) and (pointer: fine)');
const CONFIG = {
  // clips in assets/screens: the first starts in the middle, then to the right; the last sits to its left
  screens: ['nomada-toast', 'viral-loop', 'supporter', 'x-ray', 'road-test', 'ai-studio'],
  loadMin: reduce ? 1200 : 3600, // the counter takes at least this long, ms (it also waits for the clips)
  holdAt100: 450,                // a beat on 100% before the burst, ms
  spin: true,                    // an iPod spins round once, only when it's clicked
  ring: {                        // the ring video: scale, vertical shift (share of its size), opacity
    load: { s: 0.5, y: -0.059, o: 0.55 },
    end: { s: 1.08, y: 0.054, o: 1 },
    dur: 1400,                   // it grows with the burst, as one push…
    push: reduce ? 0 : 1.6,      // …overshooting a little before it settles
    flash: reduce ? 0 : 0.6,     // and flaring brighter as it goes
    turn: -0.012,                // afterwards it turns with the carousel, deg per px scrolled
    parallax: -14                // and drifts against the pointer, px
  },
  // the carousel: agrumeafarm.it's jar slider (used with permission), with its numbers as they ship there
  slider: {
    angle: 10, top: 0.55,                      // the row's tilt (deg) and centre line (share of the height)
    spacing: 0.92, width: 0.5358 * 1.15,       // per quarter of the screen width
    aspect: 1.66, maxH: 0.72,                  // iPod height to width; a cap on its height as a share of the screen
    scale: [0.55, 1.35], falloff: 0.1,         // size at the edges and in the middle; a little smaller per spacing out
    bright: [0.7, 1.1], blur: 4, speedBlur: 3.2, // brightness edge to middle; blur px by distance, and extra when moving fast
    sway: 18,                                  // each iPod swings ±18° as it travels (a full cycle every three spacings)
    offsets: [-0.053, 0.043, -0.024, 0.057, -0.048, 0.029, -0.038, 0.053], // each one sits a little higher or lower
    spread: [0.55, 0.16],                      // the middle iPod gets a little more room
    follow: 2.3, followDrag: 11,               // how fast the row catches up with the wheel or a drag (per second)
    wheel: 1.15, drag: 1.5, fling: 190, flingMax: 3.5,
    speed: 2400, speedLean: 6, speedTurn: 38, squash: 0.05, // on the move: lean, turn and shrink, by speed (px/s)
    stiffness: 70, stiffnessVar: 0.3, damping: 9,           // each iPod's own spring, slightly different per iPod
    near: { turn: 30, lean: 5, lift: 0.05, pull: 16, radius: 1.6, floor: 0.3, parallax: 26 }, // the pointer's pull
    spinMs: 2000                               // the click spin: one full turn
  }
};

const hd = document.getElementById('hd'), cv = hd.querySelector('canvas'), ringV = hd.querySelector('.ring');
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const eo = t => 1 - Math.pow(1 - t, 3);
const eio = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eback = (t, k = 1.3) => 1 + (k + 1) * Math.pow(t - 1, 3) + k * Math.pow(t - 1, 2);
const equint = t => t < 0.5 ? 16 * t ** 5 : 1 - (-2 * t + 2) ** 5 / 2;

// ---------- renderer, camera, light ----------
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
camera.position.set(0, 0, 5.4);
const key = new THREE.DirectionalLight(0xffffff, 1.1);
key.position.set(-3, 4, 5);
const fill = new THREE.HemisphereLight(0xffffff, 0x1a1418, 0.7);
scene.add(key, fill);

// the chrome reflects a neutral studio, with the ring's colours (violet and blue one side, pink and red-orange
// the other) catching the rims
function environment() {
  const env = new RoomEnvironment();
  const stops = [[-Math.PI, 0xb8c8ff], [-0.75 * Math.PI, 0xff5fa0], [-0.5 * Math.PI, 0xff4a2e], [0, 0xd13dff], [0.5 * Math.PI, 0x7b3dff], [0.75 * Math.PI, 0x4a5cff], [Math.PI, 0xb8c8ff]];
  const ring = (radius, tube, z, k) => {
    const geo = new THREE.TorusGeometry(radius, tube, 24, 160), p = geo.attributes.position, col = [], c = new THREE.Color(), a0 = new THREE.Color(), a1 = new THREE.Color();
    for (let i = 0; i < p.count; i++) {
      const a = Math.atan2(p.getY(i), p.getX(i));
      let j = 0; while (j < stops.length - 2 && a > stops[j + 1][0]) j++;
      const t = (a - stops[j][0]) / (stops[j + 1][0] - stops[j][0]);
      c.lerpColors(a0.set(stops[j][1]), a1.set(stops[j + 1][1]), t);
      col.push(c.r * k, c.g * k, c.b * k);
    }
    geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide }));
    m.position.z = z; env.add(m);
  };
  ring(4.2, 0.35, -3, 2.2);   // behind: lights the edges
  ring(5, 0.3, 4, 0.9);       // in front, dimmer: the faces catch a hint of it
  const pm = new THREE.PMREMGenerator(renderer);
  const tex = pm.fromScene(env, 0.04).texture;
  pm.dispose();
  return tex;
}
scene.environment = environment();
scene.environmentIntensity = 0;

// ---------- the iPod ----------
const W = 1, H = 1.66, D = 0.15, SY = 0.43, WY = -0.34; // body, screen centre, wheel centre (body widths)
function rrect(w, h, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
  return new THREE.ShapeGeometry(s, 8);
}
// the click wheel: MENU, skip, skip, play/pause, drawn once
function wheelTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d'), R = 256;
  const grd = g.createRadialGradient(R, R * 0.7, 30, R, R, R);
  grd.addColorStop(0, '#1d1d20'); grd.addColorStop(1, '#070708');
  g.fillStyle = grd; g.beginPath(); g.arc(R, R, R, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#000'; g.beginPath(); g.arc(R, R, 0.1 / 0.29 * R + 7, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#ececec';
  g.font = '600 44px "Helvetica Neue", Helvetica, Arial, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('MENU', R, 72);
  const tri = (x, y, s, dir) => { g.beginPath(); g.moveTo(x, y - s); g.lineTo(x + dir * s * 1.25, y); g.lineTo(x, y + s); g.closePath(); g.fill(); };
  g.fillRect(48, R - 15, 6, 30); tri(80, R, 15, -1); tri(100, R, 15, -1);         // ⏮
  g.fillRect(458, R - 15, 6, 30); tri(432, R, 15, 1); tri(412, R, 15, 1);         // ⏭
  tri(226, 446, 15, 1); g.fillRect(252, 431, 7, 30); g.fillRect(266, 431, 7, 30); // ⏯
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
const GEO = {
  shell: new RoundedBoxGeometry(W, H, D, 5, 0.075),
  face: rrect(W - 0.04, H - 0.04, 0.058),
  bezel: rrect(0.86, 0.665, 0.03),
  screen: new THREE.PlaneGeometry(0.8, 0.6),
  wheel: new THREE.CircleGeometry(0.29, 96),
  button: new THREE.CircleGeometry(0.1, 64)
};
const MAT = {
  shell: new THREE.MeshPhysicalMaterial({ color: 0xc4c1c7, metalness: 1, roughness: 0.12, clearcoat: 0.4, clearcoatRoughness: 0.15 }),
  face: new THREE.MeshStandardMaterial({ color: 0x645f65, metalness: 0.85, roughness: 0.36 }), // graphite
  bezel: new THREE.MeshStandardMaterial({ color: 0x020202, metalness: 0.2, roughness: 0.25 }),
  // a sheet of glass over the screen that only adds reflections
  glass: new THREE.MeshStandardMaterial({ color: 0x000000, metalness: 1, roughness: 0.05, transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending, depthWrite: false }),
  wheel: new THREE.MeshStandardMaterial({ map: wheelTexture(), metalness: 0.05, roughness: 0.55 })
};

const row = new THREE.Group();
scene.add(row);
const SW = 512, SH = 384; // screen canvas, 4:3 like the clips
function pod(name, i) {
  const g = new THREE.Group(), z = D / 2;
  const part = (geo, mat, y, dz) => { const m = new THREE.Mesh(geo, mat); m.position.set(0, y, z + dz); g.add(m); return m; };
  const shell = new THREE.Mesh(GEO.shell, MAT.shell); g.add(shell);
  part(GEO.face, MAT.face, 0, 0.0008);
  part(GEO.bezel, MAT.bezel, SY, 0.0016);
  const canvas = document.createElement('canvas'); canvas.width = SW; canvas.height = SH;
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace; tex.generateMipmaps = false; tex.minFilter = THREE.LinearFilter;
  part(GEO.screen, new THREE.MeshBasicMaterial({ map: tex, toneMapped: false }), SY, 0.0024);
  part(GEO.bezel, MAT.glass, SY, 0.0032);
  part(GEO.wheel, MAT.wheel, WY, 0.0016);
  part(GEO.button, MAT.face, WY, 0.0024);
  row.add(g);
  const video = document.createElement('video');
  Object.assign(video, { src: `assets/screens/${name}.mp4`, muted: true, loop: true, playsInline: true, preload: 'auto' });
  const poster = new Image(); poster.src = `assets/screens/${name}.jpg`;
  const spring = () => ({ v: 0, vel: 0 });
  const it = { i, name, g, ctx: canvas.getContext('2d'), tex, video, poster, ph: i * 1.7 + 0.4, ex: null, blurN: 0, bright: 1, front: 0,
    turn: spring(), lean: spring(), lift: spring(), pullX: spring(), pullY: spring(), // each iPod's own springs, as the jars have
    spinT: -1 };
  shell.userData.it = it;
  // the mask pass reads each iPod's blur and brightness from here
  g.traverse(m => { if (m.isMesh) m.onBeforeRender = (r, s, c, geo, mat) => { if (mat === maskMat) { mat.uniforms.uBlur.value = it.blurN; mat.uniforms.uBright.value = it.bright; mat.uniformsNeedUpdate = true; } }; });
  g.rotation.order = 'ZYX'; // turn about the iPod's own long axis, then lean it in the screen plane, like the jars
  return it;
}
// per-iPod blur and brightness, drawn into a mask the depth-of-field pass reads
const maskMat = new THREE.ShaderMaterial({
  uniforms: { uBlur: { value: 0 }, uBright: { value: 1 } },
  vertexShader: `void main() { gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform float uBlur, uBright; void main() { gl_FragColor = vec4(uBlur, uBright * 0.5, 0.0, 1.0); }`
});
const items = CONFIG.screens.map(pod);
const count = items.length;

// ---------- the carousel's layout, in screen pixels (agrumeafarm.it's sizes) ----------
const L = {};
function layout() {
  const S = CONFIG.slider, w = innerWidth, h = innerHeight, small = w <= 480, mid = !small && w <= 1024;
  const Z = w / (small || mid ? 3 : 4);
  Object.assign(L, { w, h, N: Z * (small ? 1.15 : mid ? 1.265 : S.spacing), u: Z * (small ? 0.73 * 1.15 : mid ? 0.7875 * 1.15 : S.width) });
  L.R = L.u * S.aspect;
  if (L.R > h * S.maxH) { L.R = h * S.maxH; L.u = L.R / S.aspect; }
  L.F = count * L.N; L.j = 2 * L.u; L.Y = 3 * L.N;
  L.top = (small ? 0.45 : mid ? 0.43 : S.top) * h;
  L.cos = Math.cos(S.angle * Math.PI / 180); L.sin = Math.sin(S.angle * Math.PI / 180);
}
// where an iPod sits along the looping row for a scroll offset H (px)
const trackX = (i, H) => (((i * L.N + L.u / 2 + H + L.j) % L.F) + L.F) % L.F - L.j;

// ---------- the floor (loader only): the iPod's reflection, fading with distance ----------
const floorShader = {
  name: 'FloorReflection',
  uniforms: { color: { value: null }, tDiffuse: { value: null }, textureMatrix: { value: null }, opacity: { value: 0 } },
  vertexShader: `uniform mat4 textureMatrix; varying vec4 vUv; varying vec2 vP;
    void main() { vUv = textureMatrix * vec4(position, 1.0); vP = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `uniform vec3 color; uniform sampler2D tDiffuse; uniform float opacity; varying vec4 vUv; varying vec2 vP;
    void main() {
      vec4 b = texture2DProj(tDiffuse, vUv);
      float f = exp(-length(vP * vec2(0.8, 1.7)) * 1.25);
      gl_FragColor = vec4(b.rgb * color, b.a * f * opacity);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
};
const floor = new Reflector(new THREE.PlaneGeometry(10, 10), { shader: floorShader, color: 0x8a8a8a, textureWidth: 1024, textureHeight: 1024, clipBias: 0.003 });
floor.material.transparent = true;
floor.material.depthWrite = false;
floor.rotation.x = -Math.PI / 2;
floor.position.y = -H / 2 - 0.004;
scene.add(floor);

// ---------- screens ----------
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
let pct = 0;
function digits(g, a) {
  g.save(); g.globalAlpha = a; g.fillStyle = '#fff';
  g.font = '400 116px "Guida Mono Pro", ui-monospace, monospace'; g.letterSpacing = '12px';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(`${Math.round(pct)}%`, SW / 2 + 6, SH / 2 + 4);
  g.restore();
}
// the front iPod shows a little player, as in the concept
function player(g, v, a) {
  if (a <= 0.01) return;
  g.save(); g.globalAlpha = a;
  const grd = g.createLinearGradient(0, SH * 0.6, 0, SH); grd.addColorStop(0, 'rgba(0,0,0,0)'); grd.addColorStop(1, 'rgba(0,0,0,.72)');
  g.fillStyle = grd; g.fillRect(0, SH * 0.6, SW, SH * 0.4);
  g.fillStyle = '#fff'; g.strokeStyle = '#fff'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(24, SH - 52); g.lineTo(44, SH - 40); g.lineTo(24, SH - 28); g.closePath(); g.fill();
  g.font = '500 22px "Helvetica Neue", Helvetica, Arial, sans-serif'; g.textAlign = 'left'; g.textBaseline = 'middle';
  const t = v.currentTime || 0, d = v.duration || 10;
  g.fillText(`${fmt(t)} / ${fmt(d)}`, 60, SH - 40);
  const x = SW - 46, y = SH - 52, k = 8; // fullscreen corners
  g.beginPath(); g.moveTo(x, y + k); g.lineTo(x, y); g.lineTo(x + k, y); g.moveTo(x + 24 - k, y); g.lineTo(x + 24, y); g.lineTo(x + 24, y + k);
  g.moveTo(x + 24, y + 24 - k); g.lineTo(x + 24, y + 24); g.lineTo(x + 24 - k, y + 24); g.moveTo(x + k, y + 24); g.lineTo(x, y + 24); g.lineTo(x, y + 24 - k); g.stroke();
  g.fillStyle = 'rgba(255,255,255,.3)'; g.fillRect(22, SH - 14, SW - 44, 3);
  g.fillStyle = '#fff'; g.fillRect(22, SH - 14, (SW - 44) * clamp(t / d), 3);
  g.restore();
}
function drawScreen(it, now, appear) {
  const g = it.ctx;
  g.fillStyle = '#000'; g.fillRect(0, 0, SW, SH);
  if (phase === 'load') { digits(g, appear); it.tex.needsUpdate = true; return; }
  const u = clamp((now - T0) / 420); // the front screen hands over from 100% to its clip
  const v = it.video, src = v.readyState >= 2 ? v : it.poster;
  if (src === v || it.poster.complete) { g.globalAlpha = it.i === 0 ? u : 1; g.drawImage(src, 0, 0, SW, SH); g.globalAlpha = 1; }
  if (it.i === 0 && u < 1) digits(g, 1 - u);
  player(g, v, it.front * u);
  it.tex.needsUpdate = true;
}

// ---------- loading: fonts, the ring and the clips ----------
const waits = [document.fonts.load('400 116px "Guida Mono Pro"')];
const ready = el => new Promise(r => { if (el.readyState >= 3) r(); else { el.addEventListener('canplaythrough', r, { once: true }); el.addEventListener('error', r, { once: true }); } });
waits.push(ready(ringV));
for (const it of items) { waits.push(ready(it.video)); it.video.load(); }
let loaded = 0;
waits.forEach(p => p.then(() => loaded++, () => loaded++));

// ---------- interaction (once the burst has landed), as the jar slider takes it ----------
// sl.H is the row's scroll offset (px), easing toward sl.ae, which the wheel, a drag or a fling set
const sl = { H: 0, ae: 0, v: 0, P: 0, ppx: 0, ppy: 0, mx: 0, my: 0, inside: false, drag: null, flingV: 0 };
let settled = false, hover = null;
const pointer = new THREE.Vector2(9, 9), ray = new THREE.Raycaster();
function pick(x, y) {
  pointer.set(x / L.w * 2 - 1, -y / L.h * 2 + 1);
  ray.setFromCamera(pointer, camera);
